<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <title>Admin login - GrantFlow</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme-afs.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="/" class="brand-link"><img src="/img/logos/accenture-logo.svg" alt="Accenture" width="122" height="32"><span class="brand-product">Grant<span class="brand-flow">Flow</span></span></a></h1>
    </div>
  </header>
  <main>
    <div class="container">
      <h2>Admin login</h2>

      <!-- No script, no login: the form posts to a route that refuses anything but JSON, so a password is never put in a URL. -->
      <form id="adminForm" method="post" action="/api/admin/login" autocomplete="on" hidden>
        <p>Enter the admin password to see the developer and presenter tools.</p>
        <p>
          <label for="adminPassword">Password</label><br>
          <input type="password" id="adminPassword" name="password" autocomplete="current-password" required maxlength="256">
        </p>
        <p><button type="submit" id="adminSubmit">Log in</button></p>
      </form>

      <div id="adminIn" hidden>
        <p>You are logged in as admin. The session ends when it expires or when you log out.</p>
        <p><button type="button" id="adminLogout">Log out</button></p>
      </div>

      <p id="adminStatus" role="status" aria-live="polite"></p>
      <noscript><p class="error">Logging in needs JavaScript.</p></noscript>
    </div>
  </main>
  <script src="/js/admin-login.js"></script>
</body>
</html>
