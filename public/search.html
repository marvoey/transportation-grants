<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Grants - DOT Grant Search</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme-afs.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>DOT Grant Search</h1>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/search.html">Search Grants</a></li>
          <li><a href="/eligibility.html">Check Eligibility</a></li>
          <li><a href="/deadlines.html">Deadlines</a></li>
          <li><a href="/chat.html">Chat</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Search DOT Grant Opportunities</h2>

      <form id="searchForm">
        <div class="form-group">
          <label for="applicantType">Applicant Type</label>
          <select id="applicantType" name="applicantType">
            <option value="">All Types</option>
            <option value="state">State Government</option>
            <option value="city">City/Municipality</option>
            <option value="county">County Government</option>
            <option value="tribal">Tribal Government</option>
            <option value="mpo">Metropolitan Planning Organization</option>
            <option value="transit_agency">Transit Agency</option>
          </select>
        </div>

        <div class="form-group">
          <label for="keywords">Keywords</label>
          <input type="text" id="keywords" name="keywords" placeholder="e.g., highway, transit, infrastructure">
        </div>

        <div class="form-group">
          <label for="minAmount">Minimum Amount ($)</label>
          <input type="number" id="minAmount" name="minAmount" placeholder="e.g., 1000000">
        </div>

        <div class="form-group">
          <label for="maxAmount">Maximum Amount ($)</label>
          <input type="number" id="maxAmount" name="maxAmount" placeholder="e.g., 10000000">
        </div>

        <button type="submit">Search Grants</button>
      </form>
    </div>

    <div id="results"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
