<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grant Deadlines - DOT Grant Search</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme-afs.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>DOT Grant Search</h1>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/search.html">Search Grants</a></li>
          <li><a href="/eligibility.html">Check Eligibility</a></li>
          <li><a href="/deadlines.html">Deadlines</a></li>
          <li><a href="/chat.html">Chat</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Upcoming Grant Deadlines</h2>

      <form id="deadlineForm">
        <div class="form-group">
          <label for="daysAhead">Days Ahead: <span id="daysLabel">30</span></label>
          <input type="range" id="daysAhead" name="daysAhead" min="7" max="180" value="30" step="7">
        </div>

        <div class="form-group">
          <label for="applicantType">Filter by Applicant Type (Optional)</label>
          <select id="applicantType" name="applicantType">
            <option value="">All Types</option>
            <option value="state">State Government</option>
            <option value="city">City/Municipality</option>
            <option value="county">County Government</option>
            <option value="tribal">Tribal Government</option>
            <option value="mpo">Metropolitan Planning Organization</option>
            <option value="transit_agency">Transit Agency</option>
          </select>
        </div>

        <button type="submit">View Deadlines</button>
      </form>
    </div>

    <div id="results"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/deadlines.js"></script>
</body>
</html>
