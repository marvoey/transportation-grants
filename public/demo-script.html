<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GrantFlow demo script</title>
  <link rel="stylesheet" href="/css/demo-script.css">
</head>
<body>
  <header class="ds-head">
    <h1 id="dsTitle">Demo script</h1>
    <p class="ds-sub">Script window. Keep it beside the app; it is not part of the recording.</p>
  </header>

  <main class="ds-main">
    <details class="ds-card ds-setup">
      <summary>Before recording</summary>
      <ol id="dsSetup"></ol>
    </details>

    <nav class="ds-nav" aria-label="Scenes">
      <button type="button" id="dsPrev" class="ds-btn">&larr; Back</button>
      <span id="dsPosition" class="ds-position" aria-live="polite"></span>
      <button type="button" id="dsNext" class="ds-btn ds-btn-primary">Next &rarr;</button>
    </nav>
    <div id="dsChips" class="ds-chips" aria-label="Jump to a scene"></div>

    <article id="dsScene" class="ds-card ds-scene" aria-live="polite"></article>
    <p id="dsError" class="ds-error" role="alert" hidden></p>
  </main>

  <p id="dsCopyStatus" class="ds-toast" role="status" aria-live="polite"></p>

  <script src="/js/presenter-kit.js"></script>
  <script src="/js/demo-script.js"></script>
</body>
</html>
